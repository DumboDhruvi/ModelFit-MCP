name: Verify PyPI Package Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-pypi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: PyPI E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install modelfit-mcp from PyPI in Isolated Directory
        run: |
          mkdir -p /tmp/isolated_pypi_test
          cd /tmp/isolated_pypi_test
          echo "=== Installing modelfit-mcp[ml] from PyPI ==="
          pip install --no-cache-dir "modelfit-mcp[ml]"
          pip show modelfit-mcp

      - name: Verify CLI Commands
        run: |
          echo "=== Testing modelfit CLI ==="
          modelfit --help
          modelfit specs

      - name: Run Full End-to-End Verification Script
        id: run_e2e
        run: |
          cd /tmp/isolated_pypi_test
          cat << 'EOF' > test_pypi_e2e.py
          import sys
          import json
          import traceback
          import importlib.metadata
          from pprint import pprint

          results = []

          def log_test(name, success, details=""):
              status_str = "PASS" if success else "FAIL"
              results.append((name, status_str, details))
              print(f"[{status_str}] {name} - {details}")

          print("=" * 60)
          print("MODELFIT-MCP PYPI RELEASE E2E VERIFICATION")
          print("=" * 60)

          # 1. Verify Import Source and Version
          try:
              import modelfit
              import modelfit.server as server
              from modelfit.adapter import gateway
              from modelfit.hardware import detect_system_specs, estimate_required_memory_gb, can_model_run

              pkg_version = importlib.metadata.version("modelfit-mcp")
              is_pip_install = ("site-packages" in modelfit.__file__) or ("dist-packages" in modelfit.__file__)
              assert is_pip_install, f"Not from site/dist-packages: {modelfit.__file__}"
              assert pkg_version == "0.1.0", f"Unexpected version: {pkg_version}"
              log_test("Import from PyPI", True, f"v{pkg_version} from {modelfit.__file__}")
          except Exception as e:
              log_test("Import from PyPI", False, f"{type(e).__name__}: {str(e)}")

          # 2. Hardware Detection & Memory Sizing
          try:
              specs = detect_system_specs()
              mem_fit_gb = estimate_required_memory_gb(params_in_billions=0.5, precision="fp16")
              fit_check = can_model_run(0.5, specs, precision="fp16")
              assert mem_fit_gb > 0
              log_test("Hardware & Sizing", True, f"{specs.cpu_count} CPUs, {specs.ram_total_gb:.1f}GB RAM, Sizing: {mem_fit_gb}GB, Target: {fit_check['target']}")
          except Exception as e:
              log_test("Hardware & Sizing", False, f"{type(e).__name__}: {str(e)}")

          # 3. Test MCP Tool: get_hardware_specs
          try:
              res = server.handle_tool_call("get_hardware_specs", {})
              assert res["status"] == "success"
              assert "ram_available_gb" in res["specs"]
              log_test("MCP get_hardware_specs", True, f"RAM avail: {res['specs']['ram_available_gb']} GB")
          except Exception as e:
              log_test("MCP get_hardware_specs", False, f"{type(e).__name__}: {str(e)}")

          # 4. Test MCP Tool: search_compatible_models
          try:
              res = server.handle_tool_call("search_compatible_models", {
                  "query": "bert",
                  "pipeline_tag": "text-classification",
                  "precision": "fp16"
              })
              assert res["status"] == "success"
              log_test("MCP search_compatible_models", True, f"Found {res.get('count', 0)} models")
          except Exception as e:
              log_test("MCP search_compatible_models", False, f"{type(e).__name__}: {str(e)}")

          # 5. Test MCP Tool: get_integration_code
          try:
              res = server.handle_tool_call("get_integration_code", {
                  "model_id": "hf-internal-testing/tiny-random-DistilBertForSequenceClassification",
                  "pipeline_tag": "text-classification",
                  "target_device": "cpu"
              })
              assert res["status"] == "success"
              assert "pipeline(" in res["code"]
              log_test("MCP get_integration_code", True, "Generated Python inference snippet")
          except Exception as e:
              log_test("MCP get_integration_code", False, f"{type(e).__name__}: {str(e)}")

          # 6. Test MCP Tool: recommend_and_scaffold
          try:
              res = server.handle_tool_call("recommend_and_scaffold", {
                  "query": "bert",
                  "pipeline_tag": "text-classification"
              })
              log_test("MCP recommend_and_scaffold", True, f"Status: {res.get('status')}")
          except Exception as e:
              log_test("MCP recommend_and_scaffold", False, f"{type(e).__name__}: {str(e)}")

          # 7. Test MCP Tool: find_ensemble_models
          try:
              res = server.handle_tool_call("find_ensemble_models", {
                  "query": "bert",
                  "pipeline_tag": "text-classification",
                  "max_models": 3
              })
              assert res["status"] == "success"
              log_test("MCP find_ensemble_models", True, f"Found {res.get('count', 0)} candidates")
          except Exception as e:
              log_test("MCP find_ensemble_models", False, f"{type(e).__name__}: {str(e)}")

          # 8. Real Model Loading & Live Inference
          m1 = "hf-internal-testing/tiny-random-DistilBertForSequenceClassification"
          try:
              load_res = server.handle_tool_call("swap_active_model", {
                  "model_id": m1,
                  "pipeline_tag": "text-classification",
                  "params_billions": 0.01
              })
              assert load_res["status"] == "success", f"Load failed: {load_res}"

              status_res = server.handle_tool_call("get_active_model_status", {})
              assert status_res["active_model"] == m1

              test_input_1 = "ModelFit-MCP prevents OOM errors and guarantees safe memory bounds for agents."
              preds_1 = gateway.predict(test_input_1)
              assert len(preds_1) > 0
              log_test("Live Model Inference (DistilBERT)", True, f"Model: {m1}, Pred: label={preds_1[0].label}, score={preds_1[0].score}")
          except Exception as e:
              log_test("Live Model Inference (DistilBERT)", False, f"{type(e).__name__}: {str(e)}")

          # 9. Dynamic Hot-Swapping with VRAM Purge
          m2 = "hf-internal-testing/tiny-random-BertForSequenceClassification"
          try:
              swap_res = server.handle_tool_call("swap_active_model", {
                  "model_id": m2,
                  "pipeline_tag": "text-classification",
                  "params_billions": 0.01
              })
              assert swap_res["status"] == "success"
              status_res2 = server.handle_tool_call("get_active_model_status", {})
              assert status_res2["active_model"] == m2

              test_input_2 = "Zero-latency model hot swapping with clean garbage collection."
              preds_2 = gateway.predict(test_input_2)
              assert len(preds_2) > 0
              log_test("Hot-Swap & Inference (BERT)", True, f"Swapped to: {m2}, Pred: label={preds_2[0].label}, score={preds_2[0].score}")
          except Exception as e:
              log_test("Hot-Swap & Inference (BERT)", False, f"{type(e).__name__}: {str(e)}")

          # 10. Test MCP Tool: benchmark_models (Empirical Benchmarking)
          try:
              bench_res = server.handle_tool_call("benchmark_models", {
                  "model_ids": [m1, m2],
                  "test_samples": [
                      "The autonomous system performed without memory faults.",
                      "System failure occurred due to lack of available hardware RAM."
                  ],
                  "pipeline_tag": "text-classification"
              })
              assert bench_res["status"] == "success"
              leader = bench_res.get("recommended_model")
              lb = bench_res.get("leaderboard", [])
              log_test("Empirical Benchmarking", True, f"Evaluated: {bench_res['evaluated_count']}, Recommended: {leader}")
          except Exception as e:
              log_test("Empirical Benchmarking", False, f"{type(e).__name__}: {str(e)}")

          # 11. Test MCP Tool: ensemble_predict (Multi-Model Ensemble)
          try:
              ens_res_avg = server.handle_tool_call("ensemble_predict", {
                  "model_ids": [m1, m2],
                  "input_data": "ModelFit-MCP high performance ensemble prediction test sample.",
                  "pipeline_tag": "text-classification",
                  "strategy": "weighted_average"
              })
              assert ens_res_avg["status"] == "success"

              ens_res_vote = server.handle_tool_call("ensemble_predict", {
                  "model_ids": [m1, m2],
                  "input_data": "ModelFit-MCP high performance ensemble prediction test sample.",
                  "pipeline_tag": "text-classification",
                  "strategy": "majority_vote"
              })
              assert ens_res_vote["status"] == "success"
              log_test("Ensemble Predictions", True, f"Weighted Avg: {len(ens_res_avg['predictions'])} preds, Majority Vote: {len(ens_res_vote['predictions'])} preds")
          except Exception as e:
              log_test("Ensemble Predictions", False, f"{type(e).__name__}: {str(e)}")

          # 12. STDIO JSON-RPC 2.0 Simulation
          try:
              import io
              saved_stdin = sys.stdin
              saved_stdout = sys.stdout

              req_list = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/list"}) + "\n"
              req_call = json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "get_hardware_specs", "arguments": {}}}) + "\n"

              sys.stdin = io.StringIO(req_list + req_call)
              sys.stdout = io.StringIO()

              server.run_stdio_server()

              output = sys.stdout.getvalue()
              sys.stdin = saved_stdin
              sys.stdout = saved_stdout

              lines = [json.loads(l) for l in output.strip().split("\n") if l.strip()]
              assert len(lines) == 2
              assert len(lines[0]["result"]["tools"]) == 9
              assert lines[1]["result"]["status"] == "success"
              log_test("STDIO JSON-RPC 2.0", True, "9 tools listed, tools/call succeeded")
          except Exception as e:
              log_test("STDIO JSON-RPC 2.0", False, f"{type(e).__name__}: {str(e)}")

          # Write Step Summary Markdown
          summary_md = ["# 🧪 PyPI Package E2E Verification Report\n", "| Test Case | Status | Details |", "| :--- | :--- | :--- |"]
          all_passed = True
          for name, status, details in results:
              icon = "✅" if status == "PASS" else "❌"
              if status != "PASS":
                  all_passed = False
              summary_md.append(f"| **{name}** | {icon} {status} | `{details}` |")

          with open("/tmp/summary.md", "w") as f:
              f.write("\n".join(summary_md) + "\n")

          print("\n" + "=" * 60)
          print("SUMMARY:")
          for name, status, details in results:
              print(f"  {'✅' if status == 'PASS' else '❌'} {name}: {details}")
          print("=" * 60)

          if not all_passed:
              sys.exit(1)
          EOF

          python test_pypi_e2e.py || EXIT_CODE=$?
          cp /tmp/summary.md /tmp/verified_report.md
          exit ${EXIT_CODE:-0}

      - name: Save Verification Report Artifact
        if: always()
        run: |
          cp /tmp/summary.md test_summary.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test_summary.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: publish live PyPI E2E verification test report [skip ci]"
            git push origin main
          fi
          cat test_summary.md >> $GITHUB_STEP_SUMMARY
