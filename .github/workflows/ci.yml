name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[ml,dev]"

    - name: Run unit and integration tests with pytest
      run: |
        python -m pytest tests -v --tb=short > test_err.log 2>&1 || {
          cat test_err.log
          python -c '
        with open("test_err.log") as f:
            lines = f.readlines()
        failures = [l.strip() for l in lines if "FAILED" in l or "ERROR" in l or "AssertionError" in l or "Traceback" in l or "Exception" in l]
        for f_line in failures[:15]:
            print(f"::error title=Pytest Details::{f_line}")
          '
          exit 1
        }
