[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelfit-mcp"
version = "0.1.1"
description = "Hardware-aware Hugging Face discovery, sizing, and swappable local model gateway for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dhruv Kumar", email = "dhruv01112004@gmail.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "huggingface",
    "hardware",
    "vram",
    "ai-agents",
    "transformers",
    "ensemble",
    "benchmarking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/DumboDhruvi/ModelFit-MCP"
Documentation = "https://dumbodhruvi.github.io/ModelFit-MCP"
Repository = "https://github.com/DumboDhruvi/ModelFit-MCP.git"
Issues = "https://github.com/DumboDhruvi/ModelFit-MCP/issues"

[project.scripts]
modelfit = "modelfit.cli:main"
modelfit-server = "modelfit.server:run_stdio_server"
modelfit-api = "modelfit.local_api:run_api_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
